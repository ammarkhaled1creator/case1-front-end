<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account — Tailora</title>

<link rel="icon" href="assets/images/logo.png">

<link rel="stylesheet" href="assets/css/tailora.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

<div id="tl-nav-mount"></div>

<main class="tl-auth-shell">

  <div class="tl-hero-bg"></div>

  <div class="tl-card tl-auth-card tl-reveal">

    <!-- Brand -->
    <a href="index.html" class="tl-brand">
      <picture class="tl-brand-logo">
        <img
          src="assets/images/logo-light.png"
          alt="Tailora"
          class="tl-logo-light"
        >
        <img
          src="assets/images/logo-dark.png"
          alt="Tailora"
          class="tl-logo-dark"
        >
      </picture>
    </a>

    <!-- Heading -->
    <h1 class="tl-display">Start your journey</h1>

    <p>
      Create an account to build AI-tailored trips.
    </p>

    <!-- API / Validation Alert -->
    <div
      class="tl-auth-alert"
      id="auth-alert"
      role="alert"
      aria-live="polite">
    </div>

    <!-- Signup Form -->
    <form id="signup-form" novalidate>

      <!-- Full Name -->
      <div class="tl-field" id="field-name">
        <label for="name">Full name</label>

        <input
          class="tl-input"
          type="text"
          id="name"
          name="name"
          placeholder="Jordan Lee"
          required
          autocomplete="name"
        >

        <div class="tl-field-error"></div>
      </div>


      <!-- Email -->
      <div class="tl-field" id="field-email">
        <label for="email">Email address</label>

        <input
          class="tl-input"
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        >

        <div class="tl-field-error"></div>
      </div>


      <!-- Phone -->
      <div class="tl-field" id="field-phone_num">
        <label for="phone_num">Phone number</label>

        <input
          class="tl-input"
          type="tel"
          id="phone_num"
          name="phone_num"
          placeholder="+20 100 000 0000"
          required
          autocomplete="tel"
        >

        <div class="tl-field-error"></div>
      </div>


      <!-- Age + Gender -->
      <div class="tl-auth-grid">

        <!-- Age -->
        <div class="tl-field" id="field-age">
          <label for="age">Age</label>

          <input
            class="tl-input"
            type="number"
            id="age"
            name="age"
            placeholder="21"
            min="1"
            required
            autocomplete="off"
          >

          <div class="tl-field-error"></div>
        </div>

        <!-- Gender -->
        <div class="tl-field" id="field-gender">
          <label>Gender</label>
          <div style="display:flex; gap:16px; align-items:center; height:42px;">
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;">
              <input type="checkbox" id="gender_male" onclick="
                document.getElementById('gender_female').checked = false;
                document.getElementById('gender').value = this.checked ? 'Male' : '';
              ">
              Male
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;">
              <input type="checkbox" id="gender_female" onclick="
                document.getElementById('gender_male').checked = false;
                document.getElementById('gender').value = this.checked ? 'Female' : '';
              ">
              Female
            </label>
          </div>
          <input type="hidden" id="gender" name="gender" required>
          <div class="tl-field-error"></div>
        </div>

      </div>


      <!-- Country -->
      <div class="tl-field" id="field-dist_country">
        <label for="dist_country">Country</label>
        <select
          class="tl-input"
          id="dist_country"
          name="dist_country"
          required
          autocomplete="country-name"
        >
          <option value="" disabled selected>Loading countries...</option>
        </select>
        <div class="tl-field-error"></div>
      </div>


      <!-- Password -->
      <div class="tl-field" id="field-password">
        <label for="password">Password</label>
        <div style="position:relative;">
          <input class="tl-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:40px;">
          <span id="toggle-password" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; user-select:none;" onclick="
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggle-password');
            if (pwd.type === 'password') {
              pwd.type = 'text';
              icon.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24'/><line x1='1' y1='1' x2='23' y2='23'/></svg>`;
            } else {
              pwd.type = 'password';
              icon.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/></svg>`;
            }
          ">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="tl-field-error"></div>
      </div>

      <!-- Confirm Password -->
      <div class="tl-field" id="field-password_confirmation">
        <label for="password_confirmation">
          Confirm password
        </label>

        <div style="position:relative;">
          <input
            class="tl-input"
            type="password"
            id="password_confirmation"
            name="password_confirmation"
            placeholder="Repeat your password"
            minlength="6"
            required
            autocomplete="new-password"
            style="padding-right:40px;"
          >
          <span id="toggle-password-confirmation" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; user-select:none;" onclick="
            const pwd2 = document.getElementById('password_confirmation');
            const icon2 = document.getElementById('toggle-password-confirmation');
            if (pwd2.type === 'password') {
              pwd2.type = 'text';
              icon2.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24'/><line x1='1' y1='1' x2='23' y2='23'/></svg>`;
            } else {
              pwd2.type = 'password';
              icon2.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/></svg>`;
            }
          ">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>

        <div class="tl-field-error"></div>
      </div>


      <!-- Submit -->
      <button
        type="submit"
        class="tl-btn tl-btn--primary tl-btn--block tl-mt-8"
        id="signup-submit">

        Create Account

      </button>

    </form>


    <!-- Sign In -->
    <div class="tl-auth-switch">
      Already have an account?
      <a href="signin.html">Sign in</a>
    </div>

  </div>

</main>


<div id="tl-footer-mount"></div>


<!-- Core -->
<script src="assets/js/api/api.js"></script>

<!-- Catalog (Countries, Cities) -->
<script src="assets/js/api/catalog.js"></script>

<!-- Authentication -->
<script src="assets/js/api/auth.js"></script>

<!-- Shared App -->
<script src="assets/js/app.js"></script>

<!-- Auth Pages -->
<script src="assets/js/pages/auth-pages.js"></script>

<!-- Populate country dropdown from database countries table -->
<script>
  (async function() {
    const select = document.getElementById('dist_country');
    if (!select) return;
    try {
      let countries = [];
      if (window.TL && window.TL.Countries && typeof window.TL.Countries.all === 'function') {
        const res = await window.TL.Countries.all();
        countries = window.TL.Util.list(res);
      } else if (window.TL && window.TL.Api) {
        const res = await window.TL.Api.get('/countries');
        countries = window.TL.Util.list(res);
      } else {
        const response = await fetch('http://127.0.0.1:8000/api/countries');
        const result = await response.json();
        countries = Array.isArray(result) ? result : (result.data || []);
      }
      select.innerHTML = '<option value="" disabled selected>Select your country</option>';
      countries.forEach(country => {
        const countryName = country.name || country.country_information?.name || (typeof country === 'string' ? country : '');
        if (countryName) {
          const option = document.createElement('option');
          option.value = countryName;
          option.textContent = countryName;
          select.appendChild(option);
        }
      });
    } catch (error) {
      console.error('Error loading countries:', error);
      select.innerHTML = '<option value="" disabled selected>Failed to load countries</option>';
    }
  })();
</script>

</body>
</html>
