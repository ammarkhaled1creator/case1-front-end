<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('tailora_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Tailora Admin</title>

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-guest-only="true">

  <main class="tl-auth-screen">
    <div class="tl-flex tl-auth-wrap">
      <div class="tl-card tl-auth-card">

        <!-- Request form -->
        <div id="tlForgotFormPanel">
          <div class="tl-auth-brand">
            <span class="tl-brand-logo">
              <img src="images/logo-light.png" alt="Tailora" class="tl-logo-light" onerror="this.onerror=null;this.src='images/logo.png'">
              <img src="images/logo-dark.png" alt="Tailora" class="tl-logo-dark" onerror="this.onerror=null;this.src='images/logo.png'">
            </span>
            <h1>Reset your password</h1>
            <p class="tl-text-secondary">Enter the email on your Tailora Admin account and we'll send you a link to reset your password.</p>
          </div>

          <form id="tlForgotForm" novalidate>
            <div class="tl-field">
              <label for="tlForgotEmail">Email address</label>
              <div class="tl-input-group">
                <i class="bi bi-envelope tl-input-icon"></i>
                <input type="email" id="tlForgotEmail" class="tl-input" placeholder="admin@tailora.com" autocomplete="username" required>
              </div>
              <div class="tl-field-error" id="tlForgotEmailError"></div>
            </div>

            <button type="submit" class="tl-btn tl-btn--primary tl-btn--block" id="tlForgotSubmit">
              <i class="bi bi-send"></i>
              Send reset link
            </button>
          </form>
        </div>

        <!-- Confirmation panel -->
        <div id="tlForgotSuccessPanel" class="tl-empty" style="display: none;">
          <div class="tl-empty__icon">
            <i class="bi bi-envelope-check"></i>
          </div>
          <div class="tl-empty__title">Check your email</div>
          <p class="tl-empty__desc" id="tlForgotSuccessMessage">If an account exists for that address, a password reset link is on its way.</p>
        </div>

        <div class="tl-flex tl-gap-xs" style="justify-content: center; margin-top: 22px;">
          <a href="index.html" class="tl-metadata tl-link-accent"><i class="bi bi-arrow-left"></i>&nbsp;Back to sign in</a>
        </div>
      </div>
      <p class="tl-auth-footnote">Tailora Admin · AI Travel Command Center</p>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- Core API Modules -->
  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    document.getElementById("tlForgotForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const emailInput = document.getElementById("tlForgotEmail");
      const emailError = document.getElementById("tlForgotEmailError");
      const submitBtn = document.getElementById("tlForgotSubmit");

      emailInput.classList.remove("is-invalid");
      emailError.textContent = "";
      emailError.classList.remove("is-visible");

      submitBtn.disabled = true;
      if (window.TL && typeof window.TL.showLoading === "function") {
        window.TL.showLoading();
      }

      try {
        const response = await TL.Auth.forgotPassword(emailInput.value);
        document.getElementById("tlForgotSuccessMessage").textContent =
          (response && response.message) || "If an account exists for that address, a password reset link is on its way.";
        document.getElementById("tlForgotFormPanel").style.display = "none";
        document.getElementById("tlForgotSuccessPanel").style.display = "flex";
      } catch (err) {
        if (err instanceof TL.Api.ApiValidationError) {
          const messages = err.errors && err.errors.email;
          if (messages && messages.length) {
            emailInput.classList.add("is-invalid");
            emailError.textContent = messages[0];
            emailError.classList.add("is-visible");
          }
          TL.showToast(err.message, "error");
        } else {
          TL.showToast(err.message, "error");
        }
      } finally {
        submitBtn.disabled = false;
        if (window.TL && typeof window.TL.hideLoading === "function") {
          window.TL.hideLoading();
        }
      }
    });
  </script>
</body>
</html>
