<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('tailora_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Tailora Admin</title>

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body
  data-page="categories"
  data-page-title="Categories"
  data-breadcrumb="Management, Categories"
  data-requires-auth="true"
>

  <div class="tl-app">
    <aside class="tl-sidebar" id="tlSidebar" aria-label="Sidebar navigation"></aside>

    <div class="tl-main">
      <header class="tl-topbar" id="tlTopbar"></header>

      <main class="tl-content">
        <!-- Page Header -->
        <div class="tl-page-header">
          <div>
            <div class="tl-eyebrow">
              <span class="tl-badge tl-badge--info">
                <i class="bi bi-grid"></i> Taxonomy
              </span>
            </div>
            <h1 class="tl-page-title">Categories</h1>
            <p class="tl-text-secondary">
              Manage attraction and experience categories matching the Admin API.
            </p>
          </div>
        </div>

        <!-- Categories List Card -->
        <section class="tl-card tl-card--flush" style="margin-bottom: 24px;">
          <div id="categoriesList">
            <div class="tl-empty">
              <div class="tl-empty__icon">
                <i class="bi bi-hourglass-split"></i>
              </div>
              <h3 class="tl-section-title">Loading categories...</h3>
            </div>
          </div>
        </section>

        <!-- Create Category -->
        <section class="tl-card">
          <div class="tl-card__head">
            <div>
              <h2 class="tl-section-title">Create Category</h2>
              <span class="tl-metadata">POST /categories · multipart/form-data</span>
            </div>
            <i class="bi bi-plus-square tl-card-icon"></i>
          </div>

          <form id="categoryCreateForm" novalidate>
            <div class="tl-field">
              <label for="category_name">Category Name</label>
              <input id="category_name" name="name" type="text" class="tl-input" placeholder="e.g. Cultural &amp; Heritage" required>
              <div class="tl-field-error" data-error-for="name"></div>
            </div>

            <div class="tl-field">
              <label for="category_image">Category Image</label>
              <input id="category_image" name="image" type="file" class="tl-input" accept="image/*">
              <div class="tl-field-error" data-error-for="image"></div>
            </div>

            <button class="tl-btn tl-btn--primary mt-2" type="submit">
              <i class="bi bi-plus-circle"></i> Create Category
            </button>
          </form>
        </section>

      </main>
    </div>
  </div>

  <!-- Edit Category Modal (PUT /categories/{id}) -->
  <div class="modal fade" id="categoryEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content tl-modal">
        <div class="modal-header">
          <h5 class="modal-title">Edit Category</h5>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="categoryManageForm" novalidate>
          <div class="modal-body">
            <input type="hidden" id="category_id" name="id">

            <div class="tl-field">
              <label for="category_update_name">Category Name</label>
              <input id="category_update_name" name="name" type="text" class="tl-input" placeholder="Updated name">
              <div class="tl-field-error" data-error-for="name"></div>
            </div>

            <div class="tl-field">
              <label for="category_update_image">New Category Image</label>
              <input id="category_update_image" name="image" type="file" class="tl-input" accept="image/*">
              <div class="tl-field-error" data-error-for="image"></div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="tl-btn tl-btn--ghost" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="tl-btn tl-btn--danger" id="categoryDeleteBtn">
              <i class="bi bi-trash"></i> Delete Category
            </button>
            <button class="tl-btn tl-btn--primary" type="submit">
              <i class="bi bi-pencil"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- Core API Modules -->
  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script src="assets/js/api/categories.js"></script>

  <!-- Shared App & Pages -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/utils.js"></script>
  <script src="assets/js/pages/categories.js"></script>
</body>
</html>
