<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('tailora_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In — Tailora Admin</title>

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Bootstrap 5 -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body data-guest-only="true">

  <!-- =========================================================
       AUTH SCREEN
       ========================================================= -->
  <main class="tl-auth-screen">

    <div class="tl-flex tl-auth-wrap">

      <div class="tl-card tl-auth-card">

        <!-- Brand -->
        <div class="tl-auth-brand">
          <img
            src="images/logo.png"
            alt="Tailora"
          >
          <h1>Welcome back</h1>
          <p class="tl-text-secondary">
            Sign in to the Tailora Command Center to manage trips, travelers and destinations.
          </p>
        </div>

        <!-- =====================================================
             LOGIN FORM
             ===================================================== -->
        <form id="tlLoginForm" novalidate>

          <!-- Email -->
          <div class="tl-field">
            <label for="tlEmail">Email address</label>
            <div class="tl-input-group">
              <i class="bi bi-envelope tl-input-icon"></i>
              <input
                type="email"
                id="tlEmail"
                name="email"
                class="tl-input"
                placeholder="admin@tailora.com"
                autocomplete="username"
                required
              >
            </div>
            <div class="tl-field-error" id="tlEmailError"></div>
          </div>

          <!-- Password -->
          <div class="tl-field">
            <label for="tlPassword">Password</label>
            <div class="tl-input-group">
              <i class="bi bi-lock tl-input-icon"></i>
              <input
                type="password"
                id="tlPassword"
                name="password"
                class="tl-input"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
            </div>
            <div class="tl-field-error" id="tlPasswordError"></div>
          </div>

          <!-- Remember / Forgot -->
          <div class="tl-flex-between tl-auth-options">
            <label class="tl-flex tl-gap-xs tl-checkbox-label">
              <input type="checkbox" id="tlRememberMe">
              Remember me
            </label>

            <a href="forgot-password.html" class="tl-metadata tl-link-accent">
              Forgot password?
            </a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="tl-btn tl-btn--primary tl-btn--block"
            id="tlLoginSubmit"
          >
            <i class="bi bi-box-arrow-in-right"></i>
            <span id="tlLoginButtonText">Sign In</span>
          </button>
        </form>
      </div>

      <!-- Footnote -->
      <p class="tl-auth-footnote">
        Tailora Admin · AI Travel Command Center
      </p>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- Core API Modules -->
  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- Page Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const loginForm = document.getElementById("tlLoginForm");
      const emailInput = document.getElementById("tlEmail");
      const passwordInput = document.getElementById("tlPassword");
      const emailError = document.getElementById("tlEmailError");
      const passwordError = document.getElementById("tlPasswordError");
      const submitBtn = document.getElementById("tlLoginSubmit");
      const buttonText = document.getElementById("tlLoginButtonText");

      if (!loginForm) return;

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        emailInput.classList.remove("is-invalid");
        passwordInput.classList.remove("is-invalid");
        emailError.textContent = "";
        passwordError.textContent = "";
        emailError.classList.remove("is-visible");
        passwordError.classList.remove("is-visible");

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email) {
          emailInput.classList.add("is-invalid");
          emailError.textContent = "Email address is required.";
          emailError.classList.add("is-visible");
          return;
        }

        if (!password) {
          passwordInput.classList.add("is-invalid");
          passwordError.textContent = "Password is required.";
          passwordError.classList.add("is-visible");
          return;
        }

        submitBtn.disabled = true;
        buttonText.textContent = "Signing in...";
        if (window.TL && typeof window.TL.showLoading === "function") {
          window.TL.showLoading();
        }

        try {
          await window.TL.Auth.login({ email, password });

          if (window.TL && typeof window.TL.showToast === "function") {
            window.TL.showToast("Signed in successfully.", "success");
          }

          setTimeout(function () {
            window.location.replace("dashboard.html");
          }, 300);

        } catch (error) {
          if (
            window.TL &&
            window.TL.Api &&
            error instanceof window.TL.Api.ApiValidationError
          ) {
            const validationErrors = error.errors || {};
            Object.entries(validationErrors).forEach(function ([field, messages]) {
              const message = Array.isArray(messages) ? messages[0] : messages;
              if (field === "email") {
                emailInput.classList.add("is-invalid");
                emailError.textContent = message;
                emailError.classList.add("is-visible");
              }
              if (field === "password") {
                passwordInput.classList.add("is-invalid");
                passwordError.textContent = message;
                passwordError.classList.add("is-visible");
              }
            });
          }

          if (window.TL && typeof window.TL.showToast === "function") {
            window.TL.showToast(
              error && error.message ? error.message : "Unable to sign in. Please check your credentials.",
              "error"
            );
          }
        } finally {
          submitBtn.disabled = false;
          buttonText.textContent = "Sign In";
          if (window.TL && typeof window.TL.hideLoading === "function") {
            window.TL.hideLoading();
          }
        }
      });
    });
  </script>
</body>
</html>
