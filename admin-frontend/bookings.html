<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('tailora_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings — Tailora Admin</title>

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body
  data-page="bookings"
  data-page-title="Bookings"
  data-breadcrumb="Management, Bookings"
  data-requires-auth="true"
>

  <div class="tl-app">
    <aside class="tl-sidebar" id="tlSidebar" aria-label="Sidebar navigation"></aside>

    <div class="tl-main">
      <header class="tl-topbar" id="tlTopbar"></header>

      <main class="tl-content">
        <!-- Page Header -->
        <div class="tl-page-header">
          <div>
            <div class="tl-eyebrow">
              <span class="tl-badge tl-badge--info">
                <i class="bi bi-calendar-check"></i> Reservations
              </span>
            </div>
            <h1 class="tl-page-title">Bookings</h1>
            <p class="tl-text-secondary">
              Review, update, and manage customer bookings matching the Admin API.
            </p>
          </div>

          <button id="bookingsRefresh" class="tl-btn tl-btn--outline" type="button">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
        </div>

        <!-- Bookings Table Card -->
        <section class="tl-card tl-card--flush" style="margin-bottom: 24px;">
          <div class="tl-card__head" style="padding: 24px 24px 0;">
            <div>
              <h2 class="tl-section-title">Bookings Queue</h2>
              <span class="tl-metadata">GET /bookings · Live Reservations</span>
            </div>
          </div>

          <div id="bookingsState" style="padding: 0 24px 24px;"></div>
        </section>

        <!-- Direct Actions Card -->
        <section class="tl-card">
          <div class="tl-card__head">
            <div>
              <h2 class="tl-section-title">Direct Booking Actions</h2>
              <span class="tl-metadata">GET / PUT / DELETE /bookings/{id}</span>
            </div>
            <i class="bi bi-sliders tl-card-icon"></i>
          </div>

          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <div class="tl-field mb-0">
                <label for="booking_id">Booking ID</label>
                <input id="booking_id" type="number" class="tl-input" placeholder="Enter ID">
              </div>
            </div>

            <div class="col-md-4">
              <div class="tl-field mb-0">
                <label for="booking_status">New Status</label>
                <select id="booking_status" class="tl-select">
                  <option value="">Select status</option>
                  <option value="confirmed">confirmed</option>
                  <option value="pending">pending</option>
                  <option value="cancelled">cancelled</option>
                </select>
              </div>
            </div>

            <div class="col-md-4">
              <div class="tl-flex tl-gap-xs flex-wrap">
                
                <button id="bookingUpdateBtn" class="tl-btn tl-btn--primary" type="button">
                  <i class="bi bi-pencil"></i> Update
                </button>
                <button id="bookingDeleteBtn" class="tl-btn tl-btn--danger" type="button">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- View Booking Modal -->
        <div class="modal fade" id="bookingViewModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content tl-modal">
              <div class="modal-header">
                <h5 class="modal-title">Booking Details</h5>
                <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <pre id="bookingDetails" class="tl-code-block"></pre>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- Core API Modules -->
  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script src="assets/js/api/bookings.js"></script>

  <!-- Shared App & Pages -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/utils.js"></script>
  <script src="assets/js/pages/bookings.js"></script>
</body>
</html>
