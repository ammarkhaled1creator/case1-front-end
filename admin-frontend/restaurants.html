<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem('tailora_theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants — Tailora Admin</title>

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailora Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body
  data-page="restaurants"
  data-page-title="Restaurants"
  data-breadcrumb="Management, Restaurants"
  data-requires-auth="true"
>

  <div class="tl-app">
    <aside class="tl-sidebar" id="tlSidebar" aria-label="Sidebar navigation"></aside>

    <div class="tl-main">
      <header class="tl-topbar" id="tlTopbar"></header>

      <main class="tl-content">
        <!-- Page Header -->
        <div class="tl-page-header">
          <div>
            <div class="tl-eyebrow">
              <span class="tl-badge tl-badge--info">
                <i class="bi bi-cup-hot"></i> Dining &amp; Culinary
              </span>
            </div>
            <h1 class="tl-page-title">Restaurants</h1>
            <p class="tl-text-secondary">
              Manage dining establishments, cuisines, booking features and ratings matching the Admin API.
            </p>
          </div>
        </div>

        <!-- Restaurant List Card -->
        <section class="tl-card tl-card--flush" style="margin-bottom: 24px;">
          <div id="restaurantList">
            <div class="tl-empty">
              <div class="tl-empty__icon">
                <i class="bi bi-hourglass-split"></i>
              </div>
              <h3 class="tl-section-title">Loading restaurants...</h3>
            </div>
          </div>
        </section>

        <!-- Create Restaurant -->
        <section class="tl-card">
          <div class="tl-card__head">
            <div>
              <h2 class="tl-section-title">Create Restaurant</h2>
              <span class="tl-metadata">POST /restaurants</span>
            </div>
            <i class="bi bi-plus-square tl-card-icon"></i>
          </div>

          <form id="restaurantCreateForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_name">Name</label>
                  <input id="restaurant_name" name="restaurant_name" type="text" class="tl-input" placeholder="e.g. Bella Italia" required>
                  <div class="tl-field-error" data-error-for="restaurant_name"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_city">City</label>
                  <input id="restaurant_city" name="restaurant_city" type="text" class="tl-input" placeholder="e.g. Florence" required>
                  <div class="tl-field-error" data-error-for="restaurant_city"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_address">Address</label>
                  <input id="restaurant_address" name="restaurant_address" type="text" class="tl-input" placeholder="e.g. Via Roma 12">
                  <div class="tl-field-error" data-error-for="restaurant_address"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_locality">Locality</label>
                  <input id="restaurant_locality" name="restaurant_locality" type="text" class="tl-input" placeholder="e.g. Historic Center">
                  <div class="tl-field-error" data-error-for="restaurant_locality"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_cuisines">Cuisines</label>
                  <input id="restaurant_cuisines" name="restaurant_cuisines" type="text" class="tl-input" placeholder="e.g. Italian, Pasta, Pizza">
                  <div class="tl-field-error" data-error-for="restaurant_cuisines"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_average_cost_for_two">Avg. Cost for Two</label>
                  <input id="restaurant_average_cost_for_two" name="restaurant_average_cost_for_two" type="number" class="tl-input" placeholder="e.g. 60">
                  <div class="tl-field-error" data-error-for="restaurant_average_cost_for_two"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_price_range">Price Range (1-5)</label>
                  <input id="restaurant_price_range" name="restaurant_price_range" type="number" class="tl-input" placeholder="e.g. 3">
                  <div class="tl-field-error" data-error-for="restaurant_price_range"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_currency">Currency</label>
                  <input id="restaurant_currency" name="restaurant_currency" type="text" class="tl-input" placeholder="e.g. EUR, USD">
                  <div class="tl-field-error" data-error-for="restaurant_currency"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_latitude">Latitude</label>
                  <input id="restaurant_latitude" name="restaurant_latitude" type="text" class="tl-input" placeholder="e.g. 43.7696">
                  <div class="tl-field-error" data-error-for="restaurant_latitude"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_longitude">Longitude</label>
                  <input id="restaurant_longitude" name="restaurant_longitude" type="text" class="tl-input" placeholder="e.g. 11.2558">
                  <div class="tl-field-error" data-error-for="restaurant_longitude"></div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="tl-field">
                  <label for="restaurant_has_table_booking">Table Booking</label>
                  <select id="restaurant_has_table_booking" name="restaurant_has_table_booking" class="tl-select">
                    <option value="">Select</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                  <div class="tl-field-error" data-error-for="restaurant_has_table_booking"></div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="tl-field">
                  <label for="restaurant_has_online_delivery">Online Delivery</label>
                  <select id="restaurant_has_online_delivery" name="restaurant_has_online_delivery" class="tl-select">
                    <option value="">Select</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                  <div class="tl-field-error" data-error-for="restaurant_has_online_delivery"></div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="tl-field">
                  <label for="restaurant_is_delivering_now">Delivering Now</label>
                  <select id="restaurant_is_delivering_now" name="restaurant_is_delivering_now" class="tl-select">
                    <option value="">Select</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                  <div class="tl-field-error" data-error-for="restaurant_is_delivering_now"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_rating">Rating</label>
                  <input id="restaurant_rating" name="restaurant_rating" type="number" step="0.1" class="tl-input" placeholder="e.g. 4.6">
                  <div class="tl-field-error" data-error-for="restaurant_rating"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_votes">Votes</label>
                  <input id="restaurant_votes" name="restaurant_votes" type="number" class="tl-input" placeholder="e.g. 350">
                  <div class="tl-field-error" data-error-for="restaurant_votes"></div>
                </div>
              </div>
            </div>

            <button class="tl-btn tl-btn--primary mt-2" type="submit">
              <i class="bi bi-plus-circle"></i> Create Restaurant
            </button>
          </form>
        </section>

      </main>
    </div>
  </div>

  <!-- Edit Restaurant Modal (PUT /restaurants/{id}) -->
  <div class="modal fade" id="restaurantEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content tl-modal">
        <div class="modal-header">
          <h5 class="modal-title">Edit Restaurant</h5>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="restaurantManageForm" novalidate>
          <div class="modal-body">
            <input type="hidden" id="restaurant_id" name="restaurant_id">
            <div class="row g-3">
              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_name">Name</label>
                  <input id="restaurant_u_name" name="restaurant_u_name" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_name"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_city">City</label>
                  <input id="restaurant_u_city" name="restaurant_u_city" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_city"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_address">Address</label>
                  <input id="restaurant_u_address" name="restaurant_u_address" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_address"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_locality">Locality</label>
                  <input id="restaurant_u_locality" name="restaurant_u_locality" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_locality"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_cuisines">Cuisines</label>
                  <input id="restaurant_u_cuisines" name="restaurant_u_cuisines" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_cuisines"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_average_cost_for_two">Avg. Cost for Two</label>
                  <input id="restaurant_u_average_cost_for_two" name="restaurant_u_average_cost_for_two" type="number" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_average_cost_for_two"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_price_range">Price Range (1-5)</label>
                  <input id="restaurant_u_price_range" name="restaurant_u_price_range" type="number" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_price_range"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_currency">Currency</label>
                  <input id="restaurant_u_currency" name="restaurant_u_currency" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_currency"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_latitude">Latitude</label>
                  <input id="restaurant_u_latitude" name="restaurant_u_latitude" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_latitude"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_longitude">Longitude</label>
                  <input id="restaurant_u_longitude" name="restaurant_u_longitude" type="text" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_longitude"></div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="tl-field">
                  <label for="restaurant_u_has_table_booking">Table Booking</label>
                  <select id="restaurant_u_has_table_booking" name="restaurant_u_has_table_booking" class="tl-select">
                    <option value="">Select</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                  <div class="tl-field-error" data-error-for="restaurant_u_has_table_booking"></div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="tl-field">
                  <label for="restaurant_u_has_online_delivery">Online Delivery</label>
                  <select id="restaurant_u_has_online_delivery" name="restaurant_u_has_online_delivery" class="tl-select">
                    <option value="">Select</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                  <div class="tl-field-error" data-error-for="restaurant_u_has_online_delivery"></div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="tl-field">
                  <label for="restaurant_u_is_delivering_now">Delivering Now</label>
                  <select id="restaurant_u_is_delivering_now" name="restaurant_u_is_delivering_now" class="tl-select">
                    <option value="">Select</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                  <div class="tl-field-error" data-error-for="restaurant_u_is_delivering_now"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_rating">Rating</label>
                  <input id="restaurant_u_rating" name="restaurant_u_rating" type="number" step="0.1" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_rating"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="tl-field">
                  <label for="restaurant_u_votes">Votes</label>
                  <input id="restaurant_u_votes" name="restaurant_u_votes" type="number" class="tl-input" placeholder="">
                  <div class="tl-field-error" data-error-for="restaurant_u_votes"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="tl-btn tl-btn--ghost" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="tl-btn tl-btn--danger" id="restaurantDeleteBtn">
              <i class="bi bi-trash"></i> Delete Restaurant
            </button>
            <button class="tl-btn tl-btn--primary" type="submit">
              <i class="bi bi-pencil"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

  <!-- Core API Modules -->
  <script src="assets/js/api/api.js"></script>
  <script src="assets/js/api/auth.js"></script>
  <script src="assets/js/api/restaurants.js"></script>

  <!-- Shared App & Pages -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/utils.js"></script>
  <script src="assets/js/pages/restaurants.js"></script>
</body>
</html>
